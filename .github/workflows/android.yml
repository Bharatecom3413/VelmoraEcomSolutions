
name: Build Velmora APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir extracted
          unzip -o ./*.zip -d extracted
          find extracted -name build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p extracted/VelmoraEcomSolutions assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Velmora-APK
          path: extracted/VelmoraEcomSolutions/app/build/outputs/apk/debug/*.apk
